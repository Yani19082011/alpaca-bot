name: Alpaca Trading Bot

on:
  schedule:
    # На всеки 5 минути, 24/7 (най-краткият интервал, който GitHub реално
    # спазва за scheduled workflows). Скриптът сам проверява дали пазарът
    # е отворен и излиза веднага, ако не е. Repo-то е public, затова
    # GitHub Actions минутите тук са безплатни без лимит — затова можем
    # да си позволим по-чест cron вместо hourly (по-свежо табло).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # позволява ръчно пускане от GitHub бутона "Run workflow"

permissions:
  contents: write   # нужно, за да може стъпката по-долу да commit-ва docs/status.json обратно в repo-то

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run trading bot
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 trading_bot.py

      - name: Commit updated status snapshot
        run: |
          git config user.name "alpaca-bot"
          git config user.email "actions@github.com"
          git add docs/status.json
          git diff --cached --quiet || git commit -m "Обнови status snapshot"
          git push
